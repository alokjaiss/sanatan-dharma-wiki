name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build (validate, Astro, Pagefind)
        run: npm run build
